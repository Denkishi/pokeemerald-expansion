name: CI

# Solo la ROM di Pokémon Emerald: niente FireRed/LeafGreen, test, release o controllo docs.
on:
  push:
    branches:
      - master
      - 'ia-vgc*'
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-rom
          path: pokeemerald.gba

  # Test dell'IA VGC (stessi file di tools/vgc_training/test_veloci.ps1), in parallelo con mgba-rom-test-hydra.
  test-vgc:
    runs-on: ubuntu-latest
    # Come la compilazione locale dei test: i test usano ancora gPlayerPartyPtr/gEnemyPartyPtr (deprecati).
    env:
      DEPRECATED_ERROR: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Test VGC
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: |
          chmod +x tools/mgba/mgba-rom-test
          fail=0
          make -j$(nproc) check TESTS="VGC teams: Patatina - Altaria" || fail=1
          exit $fail

      # ROM del self-play (tools/vgc_training: selfplay.py build fa lo stesso in locale). Si scarica con
      # gh run download <id> -n selfplay-rom e si copia in tools/vgc_training/work/selfplay.gba.
      - name: ROM self-play
        if: always()
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: |
          make -j$(nproc) pokeemerald-test.elf TESTS='test/vgc_selfplay/vgc_selfplay.c'
          mkdir -p build/vgc_selfplay
          cp pokeemerald-test.elf build/vgc_selfplay/selfplay.elf
          tools/patchelf/patchelf build/vgc_selfplay/selfplay.elf gTestRunnerHeadless '\x01' gTestRunnerSkipIsFail '\x00' gTestRunnerArgv 'test/vgc_selfplay/vgc_selfplay.c\0'
          arm-none-eabi-objcopy -O binary build/vgc_selfplay/selfplay.elf build/vgc_selfplay/selfplay.gba

      - name: Upload self-play ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-rom
          path: build/vgc_selfplay/selfplay.gba
